[project]
dependencies = [
  "pygame>=2.6.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0.0",
]
description = "A pygame version of the Komikan Game (<https://adriancheuquepan.cl/komikan/>)"
name = "komikan"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.3"

[dependency-groups]
dev = [
  "commitizen>=4.10.0",
  "pytest>=9.0.2",
  "ruff>=0.14.8",
  "httpx>=0.27.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
komikan = "komikan.run:main"
komikan-api = "komikan.api.main:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.16,<0.10.0"]
