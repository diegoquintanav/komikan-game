name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest tests/ -v
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Frontend build + lint
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run lint

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog generation

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract changelog section for this version
          # Looks for lines starting with "## VERSION" until the next "## " heading
          CHANGELOG=$(awk "/^## ${VERSION} \(/,/^## [0-9]/" CHANGELOG.md | sed '$d')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release ${TAG}"
          fi
          # Write to file for the release body
          echo "$CHANGELOG" > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release_body.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
