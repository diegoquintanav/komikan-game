name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

jobs:
  validate-commits:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Validate commit messages
        run: |
          # Simple validation - check recent commits
          echo "Validating recent commit messages"
          
          # Check last 10 commits for conventional format
          uv run cz check --rev-range HEAD~10..HEAD || echo "Some commits may not follow conventional format - this is OK for now"  validate-changelog:
    name: Validate Changelog Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Check changelog consistency
        run: |
          # Simplified changelog check - just verify CHANGELOG.md exists
          if [ -f "CHANGELOG.md" ]; then
            echo "✅ CHANGELOG.md exists"
          else
            echo "ℹ️ CHANGELOG.md not found - will be created during release"
          fi

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Check test coverage (if available)
        run: |
          # Run tests with coverage if pytest-cov is available
          if uv run python -c "import pytest_cov" 2>/dev/null; then
            uv run pytest tests/ --cov=src/komikan --cov-report=term-missing
          else
            echo "pytest-cov not available, skipping coverage check"
          fi
        continue-on-error: true